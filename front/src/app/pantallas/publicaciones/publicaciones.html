<div class="feed-contenedor">
  
  <div class="feed-cabecera" style="display: flex; justify-content: space-between; align-items: center;">
    <h2>Inicio</h2>
    <select (change)="cambiarOrden($event)" style="padding: 5px; border-radius: 5px;">
      <option value="fecha">Más recientes</option>
      <option value="likes">Más Me Gusta</option>
    </select>
  </div>

  <div class="crear-publicacion-card">
    <input 
      type="text"
      [formControl]="tituloNuevaPublicacion" 
      placeholder="Título de la publicación"
      class="input-titulo">

    <input 
      type="text"
      [formControl]="imagenNuevaPublicacion" 
      placeholder="URL de la imagen (opcional)"
      class="input-titulo"
      style="margin-top: 10px;">

    <textarea 
      [formControl]="textoNuevaPublicacion" 
      placeholder="¿En que estas pensando, {{ authService.usuarioActual()?.nombre }}?"
      class="textarea-publicacion">
    </textarea>
    
    <div class="acciones-publicacion">
      <button 
        (click)="crearPublicacion()" 
        [disabled]="!textoNuevaPublicacion.value || !tituloNuevaPublicacion.value"
        class="btn-publicar">
        Publicar
      </button>
    </div>
  </div>

  <div class="feed-lista">
    @for (posteo of listaPublicaciones; track posteo.id) {
      <app-publicacion
        [publicacion]="posteo" 
        (darLike)="manejarLike($event)"
        (eliminarPost)="manejarEliminar($event)">
      </app-publicacion>
    } 
    @empty {
      <div class="mensaje-vacio">
        No hay publicaciones para mostrar.
      </div>
    }
  </div>

  <div style="text-align: center; margin-top: 20px;">
    <button (click)="cargarMas()" class="btn-publicar" style="width: auto; padding: 10px 20px;">
      Cargar más
    </button>
  </div>

</div>
