<div class="contenedor-inicio">
  <div class="tarjeta-bienvenida">
    <div class="encabezado-logo">
      <img src="/logo.png" alt="Logo My Thing" class="logo-img">
      <h1>My thing</h1>
    </div>
    
    <p>Bienvenido a la red social más tranquila o charlatana que podes encontrar...</p>
  </div>

  <div class="contenedor-botones">
    @if (!usuarioTieneSesion()) {
      <button routerLink="/login" class="btn-celeste">Login</button>
      <button routerLink="/registro" class="btn-celeste">Registro</button>
    } 
    @else {
      <button routerLink="/publicaciones" class="btn-celeste">Publicaciones</button>
      <button routerLink="/mi-perfil" class="btn-celeste">Mi Perfil</button>
    }
  </div>
</div>
